# /etc/nginx/conf.d/mjagent.conf —— 把 mjagent.example.com 换成已备案、已设为企微应用「可信域名」的域名
server {
    listen 80;
    server_name mjagent.example.com;
    # 企微可信域名校验文件 / ACME 证书验证都走 80
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location ~ ^/WW_verify_[A-Za-z0-9]+\.txt$ { root /opt/mjagent/deploy/wecom-verify; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name mjagent.example.com;

    ssl_certificate     /etc/nginx/cert/mjagent.example.com.pem;
    ssl_certificate_key /etc/nginx/cert/mjagent.example.com.key;

    location ~ ^/WW_verify_[A-Za-z0-9]+\.txt$ { root /opt/mjagent/deploy/wecom-verify; }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /api/chat 是 SSE：不缓冲、长读超时
        proxy_buffering off;
        proxy_read_timeout 330s;
    }
}
