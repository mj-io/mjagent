[project]
name = "mjagent"
version = "0.1.0"
description = "模拟客户的第三方 agent 应用：PingOne / 企业微信登录 → Scutum Token Exchange → Lyra A2A"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "python-dotenv>=1.0",
    "gunicorn>=23.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mjagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
